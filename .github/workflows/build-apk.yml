name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Compatible Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        if [ -f "./build.gradle.kts" ] || [ -f "./build.gradle" ]; then
          TARGET_DIR="."
        elif [ -f "./AmazeGoAutoSolver/build.gradle.kts" ] || [ -f "./AmazeGoAutoSolver/build.gradle" ]; then
          TARGET_DIR="./AmazeGoAutoSolver"
        else
          TARGET_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
        fi
        
        cd "$TARGET_DIR"
        chmod +x ./gradlew 2>/dev/null || true
        
        if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Amaze-GO-Solver-APK
        path: "**/build/outputs/apk/debug/*.apk"
