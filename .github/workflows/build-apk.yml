name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate and Build APK
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "Error: settings.gradle not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Building inside: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # SDK Path
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Enable AndroidX and Jetifier automatically
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # Execute build
        if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Amaze-GO-Solver-APK
        path: "**/build/outputs/apk/debug/*.apk"
