name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Standalone Gradle 8.7
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH

    - name: Build APK without Wrapper JAR
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_DIR"

        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=false" >> gradle.properties

        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Amaze-GO-Solver-APK
        path: "**/build/outputs/apk/debug/*.apk"
